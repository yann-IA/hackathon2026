# Exemple de proxy inverse nginx pour Claire (à adapter : nom, certificat).
# Copier dans /etc/nginx/sites-available/, activer, puis : sudo nginx -t && sudo systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name hackathon.exemple.fr;

    ssl_certificate     /etc/ssl/certs/hackathon.pem;
    ssl_certificate_key /etc/ssl/private/hackathon.key;

    client_max_body_size 10m;          # messages vocaux envoyés à l'écoute (whisper)

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # limite de questions par appareil
        proxy_set_header X-Forwarded-Proto https;
        # les réponses arrivent en flux (Server-Sent Events) : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name hackathon.exemple.fr;
    return 301 https://$host$request_uri;
}
